name: Android student build

on:
  push:
    branches: [codex/student-android]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle -p arounus-student-android :app:assembleDebug --stacktrace
      - name: Build release App Bundle
        run: gradle -p arounus-student-android :app:bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: arounus-student-debug-apk
          path: arounus-student-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: arounus-student-release-bundle-unsigned
          path: arounus-student-android/app/build/outputs/bundle/release/app-release.aab
