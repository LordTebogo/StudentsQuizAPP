<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a14"><title>Live lesson - NucleoCampus</title><link rel="stylesheet" href="/static/style.css"><style>
.live-shell{width:min(1280px,calc(100% - 28px));margin:auto}.join-card{max-width:650px;margin:36px auto}.room-row{display:grid;grid-template-columns:1fr auto;gap:10px}.room-row .btn{margin-top:0}.join-actions,.call-controls{display:flex;flex-wrap:wrap;gap:9px}.join-actions .btn{margin-top:12px}.live-head{display:flex;justify-content:space-between;gap:14px;align-items:center}.room-badge{padding:7px 11px;border:1px solid rgba(103,232,249,.35);border-radius:999px;color:var(--cyan);font:700 .72rem var(--font-mono)}.video-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px;margin:18px 0}.video-tile{position:relative;overflow:hidden;min-height:210px;border:1px solid var(--border);border-radius:18px;background:#020817}.video-tile video{display:block;width:100%;height:100%;min-height:210px;object-fit:cover}.video-label{position:absolute;left:10px;bottom:10px;padding:6px 9px;border-radius:999px;background:rgba(2,8,23,.78);color:#fff;font-size:.78rem}.video-tile.lecturer{border-color:rgba(103,232,249,.65)}.call-controls{position:sticky;bottom:12px;z-index:5;justify-content:center;padding:12px;border:1px solid var(--border);border-radius:16px;background:rgba(5,12,27,.92);backdrop-filter:blur(14px)}.call-controls button{margin:0}.danger-call{border-color:rgba(248,113,113,.55)!important;color:#fecaca!important;background:rgba(248,113,113,.12)!important}.privacy-strip{padding:11px 14px;border-left:3px solid #4ade80;background:rgba(74,222,128,.07);color:var(--text-muted)}@media(max-width:560px){.room-row{grid-template-columns:1fr}.live-head{align-items:flex-start;flex-direction:column}.video-grid{grid-template-columns:1fr}}
</style></head><body><main class="live-shell"><header class="top"><div class="brand-group"><img class="brand-logo" src="/branding/logo" alt=""><div class="brand-text"><div class="brand">Nucleo<span>Campus</span></div><div class="brand-tagline">Live classroom</div></div></div><nav><a id="backLink" href="/static/index.html">My workspace</a><a href="/static/index.html">Home</a></nav></header>
<section class="card join-card" id="joinCard"><span class="kicker">Live lesson</span><h1 id="joinTitle">Join a classroom</h1><p class="lede" id="joinIntro">Enter the room code shared by your lecturer.</p><label for="roomCode">Room code</label><div class="room-row"><input id="roomCode" maxlength="32" autocomplete="off" placeholder="e.g. BIO101-LIVE"><button class="btn secondary hidden" id="generateRoom" type="button">Generate code</button></div><div class="join-actions"><button class="btn" id="joinCamera" type="button">Join with camera</button><button class="btn secondary" id="joinListen" type="button">Join without camera</button></div><div id="joinMessage" aria-live="polite"></div><p class="privacy-strip"><strong>Not recorded:</strong> NucleoCampus does not save the lesson's video or audio to its database.</p></section>
<section class="hidden" id="callArea"><div class="live-head"><div><span class="kicker">Live now</span><h1 id="roomHeading">Live lesson</h1></div><div><span class="room-badge" id="roomBadge"></span> <button class="btn secondary" id="copyInvite" type="button">Copy invite</button></div></div><div class="video-grid" id="videoGrid"></div><p id="callStatus" class="muted" aria-live="polite">Connecting...</p><div class="call-controls"><button class="btn secondary" id="toggleMic" type="button">Mute</button><button class="btn secondary" id="toggleCamera" type="button">Camera off</button><button class="btn secondary" id="shareScreen" type="button">Share screen</button><button class="btn secondary danger-call" id="leaveCall" type="button">Leave</button></div></section></main>
<script>
const $=id=>document.getElementById(id),studentToken=sessionStorage.getItem('studentToken')||'',lecturerToken=sessionStorage.getItem('lecturerToken')||'',role=lecturerToken?'lecturer':studentToken?'student':'',token=lecturerToken||studentToken;let socket=null,localStream=new MediaStream(),cameraStream=null,selfId='',room='',screenTrack=null,iceServers=[{urls:'stun:stun.l.google.com:19302'}];const peers=new Map(),people=new Map(),candidateQueues=new Map();
if(role==='lecturer'){$('joinTitle').textContent='Start a live classroom';$('joinIntro').textContent='Create or enter a room code, then share it with your students.';$('generateRoom').classList.remove('hidden');$('backLink').href='/static/lecturer.html'}else if(role==='student')$('backLink').href='/static/student.html';else{$('joinCamera').disabled=true;$('joinListen').disabled=true;$('joinMessage').innerHTML='<div class="msg error">Sign in as a student or lecturer first.</div>'}
const queryRoom=new URLSearchParams(location.search).get('room');if(queryRoom)$('roomCode').value=queryRoom;
function cleanRoom(value){return value.toUpperCase().replace(/[^A-Z0-9_-]/g,'').slice(0,32)}
$('generateRoom').onclick=()=>{$('roomCode').value='LIVE-'+crypto.getRandomValues(new Uint32Array(1))[0].toString(36).toUpperCase().slice(0,6)};
function showJoin(message,error=true){$('joinMessage').innerHTML=`<div class="msg ${error?'error':'ok'}">${message.replace(/[<>&]/g,'')}</div>`}
async function join(withCamera){room=cleanRoom($('roomCode').value);if(room.length<4){showJoin('Enter a room code with at least 4 characters.');return}try{iceServers=(await fetch('/live/ice-config').then(response=>response.json())).iceServers||iceServers;if(withCamera){cameraStream=await navigator.mediaDevices.getUserMedia({video:true,audio:{echoCancellation:true,noiseSuppression:true}});localStream=cameraStream}else localStream=new MediaStream();connectSocket()}catch(error){showJoin('Camera or microphone access was blocked. You can choose Join without camera.')}}
$('joinCamera').onclick=()=>join(true);$('joinListen').onclick=()=>join(false);
function connectSocket(){const scheme=location.protocol==='https:'?'wss':'ws';socket=new WebSocket(`${scheme}://${location.host}/ws/live/${encodeURIComponent(room)}`);socket.onopen=()=>socket.send(JSON.stringify({type:'auth',role,token}));socket.onmessage=event=>handleSignal(JSON.parse(event.data));socket.onclose=()=>{if(!$('callArea').classList.contains('hidden'))$('callStatus').textContent='Disconnected from the live lesson.'};socket.onerror=()=>showJoin('Could not connect to the live lesson.');}
async function handleSignal(message){if(message.type==='error'){showJoin(message.message);socket.close();return}if(message.type==='welcome'){selfId=message.selfId;$('joinCard').classList.add('hidden');$('callArea').classList.remove('hidden');$('roomBadge').textContent=message.room;$('roomHeading').textContent=role==='lecturer'?'Your live classroom':'Live lesson';addVideo('local',localStream,'You',role);for(const person of message.participants){people.set(person.id,person);await createPeer(person.id,true)}$('callStatus').textContent=`${message.participants.length+1} participant${message.participants.length?'s':''} connected`;return}if(message.type==='peer-joined'){people.set(message.id,message);$('callStatus').textContent=`${message.name} joined`;return}if(message.type==='peer-left'){removePeer(message.id);$('callStatus').textContent=`${message.name||'A participant'} left`;return}if(message.type==='room-ended'){$('callStatus').textContent='The lecturer ended this live lesson.';leave(false);return}if(message.type==='offer'){const pc=await createPeer(message.from,false);await pc.setRemoteDescription(message.sdp);await flushCandidates(message.from);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);send({type:'answer',target:message.from,sdp:pc.localDescription});return}if(message.type==='answer'){const pc=peers.get(message.from);if(pc){await pc.setRemoteDescription(message.sdp);await flushCandidates(message.from)}return}if(message.type==='ice'){const pc=peers.get(message.from);if(pc?.remoteDescription)await pc.addIceCandidate(message.candidate).catch(()=>{});else{const queue=candidateQueues.get(message.from)||[];queue.push(message.candidate);candidateQueues.set(message.from,queue)}}}
async function createPeer(id,initiator){if(peers.has(id))return peers.get(id);const pc=new RTCPeerConnection({iceServers});peers.set(id,pc);localStream.getTracks().forEach(track=>pc.addTrack(track,localStream));pc.onicecandidate=event=>{if(event.candidate)send({type:'ice',target:id,candidate:event.candidate})};pc.ontrack=event=>{const person=people.get(id)||{name:'Participant',role:'student'};addVideo(id,event.streams[0],person.name,person.role)};pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))removePeer(id)};if(initiator){const offer=await pc.createOffer();await pc.setLocalDescription(offer);send({type:'offer',target:id,sdp:pc.localDescription})}return pc}
async function flushCandidates(id){const pc=peers.get(id),queue=candidateQueues.get(id)||[];for(const candidate of queue)await pc.addIceCandidate(candidate).catch(()=>{});candidateQueues.delete(id)}function send(data){if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify(data))}
function addVideo(id,stream,name,personRole){let tile=document.getElementById('video-'+id);if(!tile){tile=document.createElement('article');tile.id='video-'+id;tile.className='video-tile '+personRole;tile.innerHTML='<video autoplay playsinline></video><span class="video-label"></span>';$('videoGrid').appendChild(tile)}tile.querySelector('video').srcObject=stream;if(id==='local')tile.querySelector('video').muted=true;tile.querySelector('.video-label').textContent=name+(personRole==='lecturer'?' · Lecturer':'')}
function removePeer(id){peers.get(id)?.close();peers.delete(id);people.delete(id);document.getElementById('video-'+id)?.remove()}
$('toggleMic').onclick=()=>{const track=localStream.getAudioTracks()[0];if(!track)return;$('toggleMic').textContent=track.enabled?'Unmute':'Mute';track.enabled=!track.enabled};$('toggleCamera').onclick=()=>{const track=localStream.getVideoTracks()[0];if(!track)return;$('toggleCamera').textContent=track.enabled?'Camera on':'Camera off';track.enabled=!track.enabled};
$('shareScreen').onclick=async()=>{try{const display=await navigator.mediaDevices.getDisplayMedia({video:true});screenTrack=display.getVideoTracks()[0];for(const pc of peers.values()){const sender=pc.getSenders().find(item=>item.track?.kind==='video');if(sender)await sender.replaceTrack(screenTrack)}$('video-local')?.querySelector('video')&&(document.querySelector('#video-local video').srcObject=display);screenTrack.onended=stopSharing;$('shareScreen').textContent='Stop sharing'}catch(_){}};async function stopSharing(){if(!screenTrack)return;const camera=cameraStream?.getVideoTracks()[0]||null;for(const pc of peers.values()){const sender=pc.getSenders().find(item=>item.track?.kind==='video');if(sender)await sender.replaceTrack(camera)}if(cameraStream)document.querySelector('#video-local video').srcObject=cameraStream;screenTrack.stop();screenTrack=null;$('shareScreen').textContent='Share screen'}
$('copyInvite').onclick=async()=>{const url=`${location.origin}/static/live_lesson.html?room=${encodeURIComponent(room)}`;await navigator.clipboard.writeText(url);$('copyInvite').textContent='Copied'};$('leaveCall').onclick=()=>leave(true);function leave(goBack){socket?.close();for(const pc of peers.values())pc.close();localStream.getTracks().forEach(track=>track.stop());screenTrack?.stop();if(goBack)location.href=role==='lecturer'?'/static/lecturer.html':'/static/student.html'}window.addEventListener('beforeunload',()=>leave(false));
</script></body></html>
